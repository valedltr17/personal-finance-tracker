<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ transaction ? 'Edit Transaction' : 'Add Transaction' }}</h2>
      <button class="close-btn" (click)="onCancel()">×</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="type">Transaction Type *</label>
        <div class="type-selector">
          <label class="type-option" [class.selected]="formData.type === TransactionType.Expense">
            <input
              type="radio"
              name="type"
              [value]="TransactionType.Expense"
              [(ngModel)]="formData.type">
            <span class="type-label expense">Expense</span>
          </label>
          <label class="type-option" [class.selected]="formData.type === TransactionType.Income">
            <input
              type="radio"
              name="type"
              [value]="TransactionType.Income"
              [(ngModel)]="formData.type">
            <span class="type-label income">Income</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="amount">Amount *</label>
        <input
          type="number"
          id="amount"
          name="amount"
          [(ngModel)]="formData.amount"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          required>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <input
          type="text"
          id="description"
          name="description"
          [(ngModel)]="formData.description"
          placeholder="Enter description"
          maxlength="200"
          required>
      </div>

      <div class="form-group">
        <label for="date">Date *</label>
        <input
          type="date"
          id="date"
          name="date"
          [(ngModel)]="formData.date"
          required>
      </div>

      <div class="form-group">
        <label for="category">Category *</label>
        <select
          id="category"
          name="category"
          [(ngModel)]="formData.categoryId"
          required>
          <option value="0" disabled>Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">
            {{ category.name }}
          </option>
        </select>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          {{ transaction ? 'Update' : 'Create' }} Transaction
        </button>
      </div>
    </form>
  </div>
</div>

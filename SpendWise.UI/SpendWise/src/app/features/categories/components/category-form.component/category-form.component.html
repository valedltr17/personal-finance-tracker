<div class="form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? 'Edit Category' : 'New Category' }}</h2>
  </div>

  <div *ngIf="loading" class="loading">
    {{ isEditMode ? 'Loading category...' : 'Saving...' }}
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="category-form">
    <div class="form-group">
      <label for="name">Category Name *</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="categoryForm.name"
        name="name"
        placeholder="e.g., Groceries"
        required
      />
    </div>

    <div class="form-group">
      <label>Color *</label>
      <div class="d-flex">
        <input
          type="color"
          [(ngModel)]="categoryForm.color"
          name="color"
          class="color-input"
        />
        <input
          type="text"
          id="color-hexcode"
          [(ngModel)]="categoryForm.color"
          name="color-hexcode"
          placeholder="#cf554c"
          style="margin-left: 1rem"
          maxlength="7"
          required
        />
      </div>
    </div>

    <div class="preview-box">
      <h4>Preview</h4>
      <div class="category-preview"
           [ngStyle]="{'background-color': categoryForm.color + '40', 'color': categoryForm.color}">
        <div class="preview-info">
          <div class="preview-name">{{ categoryForm.name || 'Category Name' }}</div>
          <small>HEX Code Color: {{ categoryForm.color || 'Color Code' }}</small>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ isEditMode ? 'Update' : 'Create' }} Category
      </button>
    </div>
  </form>
</div>
